name: review/nits
version: 0.0.12
description: >
  Non-blocking style and taste nits — naming, stale comments, unfinished renames,
  and similar maintainer cleanup. Not correctness; not a full design review.

triggers:
  manual: true
  files_changed:
    - "**/*"

detection:
  files:
    - "**/*"

runtime:
  name: node
  version: "22"
  command:
    - dist/index.js

permissions:
  enforcement: advisory
  filesystem:
    read:
      - .
    write:
      - .adversary/results
  network: false
  environment:
    allow: []

findings:
  format: adversary.review.v1
